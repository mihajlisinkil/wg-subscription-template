name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fa, ru, zh]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.lang }}
        run: bun run build
        env:
          VITE_FALLBACK_LANGUAGE: ${{ matrix.lang }}

      - name: Package artifact
        run: |
          mkdir -p artifacts
          cp dist/index.html "artifacts/${{ matrix.lang }}.html"
          if [ "${{ matrix.lang }}" = "fa" ]; then
            cp dist/index.html artifacts/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lang }}-html
          path: artifacts
          if-no-files-found: error

  publish:
    name: Attach assets to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.html
